name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Packs the three packages as the npm job does, installs the tarballs with npm and runs the library, `ptext` and
      # the MCP server. A tag that fails here never becomes a GitHub release or an npm version.
      - name: Packages install and run
        run: node scripts/pack-check.mjs

  worker:
    name: Cloudflare Worker bundle (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter ptext-worker-example run check
        env:
          WRANGLER_SEND_METRICS: 'false'

  # A vX.Y.Z tag that passes CI becomes a GitHub release, with its CHANGELOG.md section as the notes.
  # `node scripts/release.mjs ship` writes the tag, the version files and the changelog together.
  release:
    name: GitHub release
    needs: [test, worker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # No pnpm in this job: turn off setup-node's automatic cache, which follows packageManager (pnpm).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release.mjs notes "$TAG" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already has a release"; exit 0; fi
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

  # Off until the repository variable NPM_PUBLISH is "true". Publishes each package at the tag's version, with
  # provenance, unless that version is already on npm. Auth: npm trusted publishing (OIDC), or an NPM_TOKEN secret.
  npm:
    name: Publish to npm
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Trusted publishing needs npm 11.5.1 or newer. pnpm pack turns workspace:* into the real version.
      - name: Publish @ptext/core, @ptext/mcp, @ptext/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          npm install -g npm@^11.5.1
          v="${TAG#v}"
          for p in core mcp cli; do   # core first: mcp and cli depend on it
            if npm view "@ptext/$p@$v" version >/dev/null 2>&1; then echo "@ptext/$p@$v is already on npm"; continue; fi
            (cd "packages/$p" && pnpm pack --pack-destination "$RUNNER_TEMP")
            # Sigstore's transparency log sometimes answers 500 (TLOG_CREATE_ENTRY_ERROR). Retry, unless the failed
            # attempt got the version onto npm after all.
            for attempt in 1 2 3; do
              npm publish "$RUNNER_TEMP/ptext-$p-$v.tgz" --access public --provenance && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 30
              if npm view "@ptext/$p@$v" version >/dev/null 2>&1; then break; fi
            done
          done
      # The README's commands, against npm: npm install @ptext/core, npm install -g @ptext/cli, npx -y @ptext/mcp.
      - name: Published packages install and run
        run: node scripts/pack-check.mjs --from-npm="${{ github.ref_name }}"
